<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ingresar - Vapeify</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="root">
  <div class="container">
    <div class="login-card">
      <h1>Bienvenido a Vapeify</h1>
      <p class="muted">Inicia sesión para acceder a la tienda</p>
      <input id="email" class="input" type="email" placeholder="Correo electrónico">
      <input id="password" class="input" type="password" placeholder="Contraseña">
      <input id="fullName" class="input" type="text" placeholder="Nombre completo (para registro)">
      <label class="muted">Fecha de nacimiento</label>
      <input id="dob" class="input" type="date">
      <div style="display:flex;gap:8px">
        <button id="signin" class="btn">Ingresar</button>
        <button id="signup" class="btn" style="background:#2b2b2b;color:#fff">Registrarse</button>
      </div>
      <p class="muted" style="margin-top:12px">Al registrarte aceptas los términos. Debes tener 21+ años.</p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
  <script src="auth.js"></script>
  <script>
    // allow sessionStorage override for testing if config.js isn't available
    if (!window.SUPABASE_URL && sessionStorage.getItem('SUPABASE_URL')) window.SUPABASE_URL = sessionStorage.getItem('SUPABASE_URL');
    if (!window.SUPABASE_KEY && sessionStorage.getItem('SUPABASE_KEY')) window.SUPABASE_KEY = sessionStorage.getItem('SUPABASE_KEY');
    // Fallback defaults (publishable key + URL) so page works without config.js
    // These are safe publishable credentials for your project and are required for client auth.
    if (!window.SUPABASE_URL) window.SUPABASE_URL = 'https://astrrfugwtzgrzlyycfc.supabase.co';
    if (!window.SUPABASE_KEY) window.SUPABASE_KEY = 'sb_publishable_LLjrQ-AVwqV6Iw4yb4rWwA_0o95vMNf';
    // UI helpers that use window.Auth
    const msgEl = document.createElement('div');
    msgEl.id = 'authMessage';
    msgEl.style.marginTop = '12px';
    document.querySelector('.login-card').appendChild(msgEl);

    function showMessage(text, isError = false) {
      msgEl.textContent = text;
      msgEl.style.color = isError ? '#b33' : '#2b7';
    }

    function setButtonsDisabled(disabled) {
      document.getElementById('signin').disabled = disabled;
      document.getElementById('signup').disabled = disabled;
    }

    async function onSignIn() {
      setButtonsDisabled(true);
      showMessage('Ingresando...');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { showMessage('Email y contraseña son requeridos.', true); setButtonsDisabled(false); return; }
      const { data, error } = await window.Auth.signIn(email, password);
      if (error) { showMessage(error.message || String(error), true); setButtonsDisabled(false); return; }
      showMessage('Ingreso correcto. Redirigiendo...');
      setTimeout(() => { window.location.href = 'shop.html'; }, 600);
    }

    async function onSignUp() {
      setButtonsDisabled(true);
      showMessage('Creando cuenta...');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value.trim();
      const dob = document.getElementById('dob').value;
      if (!email || !password) { showMessage('Email y contraseña son requeridos.', true); setButtonsDisabled(false); return; }
      if (!fullName) { showMessage('Introduce tu nombre completo.', true); setButtonsDisabled(false); return; }
      if (!dob) { showMessage('Introduce tu fecha de nacimiento.', true); setButtonsDisabled(false); return; }

      const { data, error } = await window.Auth.signUp(email, password, { full_name: fullName, dob });
      if (error) { showMessage(error.message || String(error), true); setButtonsDisabled(false); return; }
      showMessage('Registro iniciado. Revisa tu email para confirmar si aplica.');
      setButtonsDisabled(false);
    }

    document.getElementById('signin').addEventListener('click', onSignIn);
    document.getElementById('signup').addEventListener('click', onSignUp);

    // Redirect if already authenticated
    (async () => {
      try {
        const { data, error } = await window.Auth.getUser();
        if (!error && data?.user) window.location.href = 'shop.html';
      } catch (e) { /* ignore */ }
    })();

    // Diagnostic init: try to initialize early and show helpful debug info
    (async () => {
      const initResult = await window.Auth.init();
      if (!initResult) {
        const present = {
          SUPABASE_URL: window.SUPABASE_URL || null,
          SUPABASE_KEY: window.SUPABASE_KEY ? 'present' : null,
          window_supabase: !!window.supabase,
          window_supabase_createClient: !!(window.supabase && window.supabase.createClient)
        };
        console.warn('Auth.init failed. Diagnostic:', present);
        showMessage('Supabase client not initialized — comprueba consola para detalles.', true);
        // expose a small block with diagnostics in the UI
        const diag = document.createElement('pre');
        diag.style.color = '#faa';
        diag.style.marginTop = '8px';
        diag.textContent = JSON.stringify(present, null, 2);
        document.querySelector('.login-card').appendChild(diag);
        const manualBtn = document.createElement('button');
        manualBtn.textContent = 'Introducir claves manualmente';
        manualBtn.style.marginTop = '8px';
        manualBtn.onclick = () => {
          const url = prompt('Pega tu SUPABASE_URL (https://...):');
          if (!url) return;
          const key = prompt('Pega tu SUPABASE_KEY (publishable):');
          if (!key) return;
          sessionStorage.setItem('SUPABASE_URL', url);
          sessionStorage.setItem('SUPABASE_KEY', key);
          window.SUPABASE_URL = url; window.SUPABASE_KEY = key;
          location.reload();
        };
        document.querySelector('.login-card').appendChild(manualBtn);
        setButtonsDisabled(true);
      }
    })();
  </script>
</body>
</html>
