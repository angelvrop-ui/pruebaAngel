<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ingresar - Vapeify</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="root">
  <div class="container">
    <div class="login-card">
      <h1>Bienvenido a Vapeify</h1>
      <p class="muted">Inicia sesión para acceder a la tienda</p>
      <input id="email" class="input" type="email" placeholder="Correo electrónico">
      <input id="password" class="input" type="password" placeholder="Contraseña">
      <input id="fullName" class="input" type="text" placeholder="Nombre completo (para registro)">
      <label class="muted">Fecha de nacimiento</label>
      <input id="dob" class="input" type="date">
      <div style="display:flex;gap:8px">
        <button id="signin" class="btn">Ingresar</button>
        <button id="signup" class="btn" style="background:#2b2b2b;color:#fff">Registrarse</button>
      </div>
      <p class="muted" style="margin-top:12px">Al registrarte aceptas los términos. Debes tener 21+ años.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
  <script>
    // Read Supabase config from a `config.js` (recommended) or replace the placeholders below.
    // Create a file named `config.js` with: window.SUPABASE_URL = 'https://...'; window.SUPABASE_KEY = 'sb_publishable_...';
    const SUPABASE_URL = window.SUPABASE_URL || 'REPLACE_WITH_SUPABASE_URL';
    const SUPABASE_KEY = window.SUPABASE_KEY || 'REPLACE_WITH_PUBLISHABLE_KEY';

    if (SUPABASE_URL.startsWith('REPLACE')) {
      console.warn('Supabase config not provided. Create config.js with window.SUPABASE_URL and window.SUPABASE_KEY.');
      // Show a friendly message in-page
      const warn = document.createElement('div');
      warn.style.margin = '12px';
      warn.style.color = '#b33';
      warn.textContent = 'Falta configuración de Supabase. Crea config.js con las variables SUPABASE_URL y SUPABASE_KEY.';
      document.querySelector('.login-card').insertBefore(warn, document.querySelector('.login-card').firstChild);
    }

    if (!window.supabase || !window.supabase.createClient) {
      console.error('Supabase client library no encontrada. ¿El CDN se cargó correctamente?');
    }

    const supabase = (window.supabase && window.supabase.createClient)
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    const msgEl = document.createElement('div');
    msgEl.id = 'authMessage';
    msgEl.style.marginTop = '12px';
    document.querySelector('.login-card').appendChild(msgEl);

    function showMessage(text, isError = false) {
      msgEl.textContent = text;
      msgEl.style.color = isError ? '#b33' : '#2b7';
    }

    async function handleSignIn() {
      if (!supabase) { showMessage('Cliente Supabase no inicializado.', true); return; }
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { showMessage('Email y contraseña son requeridos.', true); return; }

      showMessage('Ingresando...');
      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          showMessage('Error: ' + error.message, true);
          return;
        }
        showMessage('Ingreso correcto. Redirigiendo...');
        // short delay so user sees the message
        setTimeout(() => { window.location.href = 'shop.html'; }, 600);
      } catch (err) {
        console.error(err);
        showMessage('Error al iniciar sesión.', true);
      }
    }

    async function handleSignUp() {
      if (!supabase) { showMessage('Cliente Supabase no inicializado.', true); return; }
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value.trim();
      const dob = document.getElementById('dob').value;
      if (!email || !password) { showMessage('Email y contraseña son requeridos.', true); return; }
      if (!fullName) { showMessage('Introduce tu nombre completo.', true); return; }
      if (!dob) { showMessage('Introduce tu fecha de nacimiento.', true); return; }

      showMessage('Creando cuenta...');
      try {
        // add user metadata so it appears in the auth user (optional)
        const { data, error } = await supabase.auth.signUp({ email, password, options: { data: { full_name: fullName, dob } } });
        if (error) { showMessage('Registro error: ' + error.message, true); return; }

        const userId = data.user?.id || null;
        if (userId) {
          // Try to insert a profile row. This requires the `profiles` table and RLS policies.
          const { error: errProfile } = await supabase.from('profiles').insert([{ user_id: userId, full_name: fullName, email, dob }]);
          if (errProfile) console.warn('No se pudo insertar perfil:', errProfile.message);
        }

        showMessage('Registro iniciado. Revisa tu email para confirmar si aplica.');
      } catch (err) {
        console.error(err);
        showMessage('Error al registrar usuario.', true);
      }
    }

    document.getElementById('signin').addEventListener('click', handleSignIn);
    document.getElementById('signup').addEventListener('click', handleSignUp);

    // If already logged in, redirect to shop
    (async () => {
      if (!supabase) return;
      try {
        const { data } = await supabase.auth.getUser();
        if (data?.user) window.location.href = 'shop.html';
      } catch (e) { /* ignore */ }
    })();
  </script>
</body>
</html>
