<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tienda - Vapeify</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="root">
  <div class="container">
    <div class="topbar">
      <div class="brand">Vapeify</div>
      <div>
        <span id="userEmail" class="muted"></span>
        <button id="logoutBtn" class="btn" style="background:#2b2b2b;color:#fff;margin-left:8px">Cerrar sesión</button>
      </div>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <div class="brand" style="color:#fff">Vapeify</div>
        <div class="nav-item active">Inicio</div>
        <div class="nav-item">Tienda</div>
        <div class="nav-item">Desechables</div>
        <div class="nav-item">Recargables</div>
        <div style="flex:1"></div>
        <div class="muted" style="font-size:12px;padding:8px">Cuenta: <span id="userEmailSidebar"></span></div>
      </aside>

      <main>
        <div class="panel">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <h2>Productos</h2>
            <div class="search">
              <span class="muted">🔍</span>
              <input id="search" placeholder="Buscar productos...">
            </div>
          </div>
          <div id="products" class="grid"></div>
        </div>
      </main>

      <aside id="cart" class="panel">
        <h3>Carrito</h3>
        <div id="cartItems"></div>
        <div id="cartTotal">Total: $0.00</div>
        <button id="checkoutBtn" class="btn">Comprar</button>
      </aside>
    </div>

    <div class="footer">Demo estilo Spotify — tienda de vapes (simulada)</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://astrrfugwtzgrzlyycfc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LLjrQ-AVwqV6Iw4yb4rWwA_0o95vMNf';
    const createClient = (window.supabase && window.supabase.createClient) ? window.supabase.createClient
      : (window.supabaseJs && window.supabaseJs.createClient) ? window.supabaseJs.createClient
      : (window.supabaseLib && window.supabaseLib.createClient) ? window.supabaseLib.createClient
      : null;
    if (!createClient) throw new Error('Supabase library not found');
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    // require auth
    (async () => {
      const { data } = await supabase.auth.getUser();
      const user = data?.user || null;
      if (!user) { window.location.href = 'login.html'; return; }
      document.getElementById('userEmail').textContent = user.email;
      const s = document.getElementById('userEmailSidebar'); if(s) s.textContent = user.email;
    })();

    const PRODUCTS = [
      { id: 1, name: 'Cuaderno A5', price: 3.99, desc: 'Cuaderno rayado, 100 hojas', img: 'https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=800&q=80' },
      { id: 2, name: 'Bolígrafo Gel x5', price: 4.5, desc: 'Pack de 5 bolígrafos gel', img: 'https://images.unsplash.com/photo-1519710164239-da123dc03ef4?auto=format&fit=crop&w=800&q=80' },
      { id: 3, name: 'Mochila Escolar', price: 29.99, desc: 'Mochila con compartimentos', img: 'https://images.unsplash.com/photo-1553729459-efe14ef6055d?auto=format&fit=crop&w=800&q=80' },
      { id: 4, name: 'Estuche Organizador', price: 9.5, desc: 'Estuche para lápices', img: 'https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&w=800&q=80' },
      { id: 5, name: 'Marcadores Pack', price: 6.99, desc: 'Pack de marcadores de colores', img: 'https://images.unsplash.com/photo-1596495577886-d920f1fb1d61?auto=format&fit=crop&w=800&q=80' },
      { id: 6, name: 'Tijeras', price: 2.99, desc: 'Tijeras para manualidades', img: 'https://images.unsplash.com/photo-1516453492142-48d0d9f1a1f5?auto=format&fit=crop&w=800&q=80' }
    ];

    const productsEl = document.getElementById('products');
    const cartItemsEl = document.getElementById('cartItems');
    const cartTotalEl = document.getElementById('cartTotal');
    const checkoutBtn = document.getElementById('checkoutBtn');
    const searchEl = document.getElementById('search');

    const cart = [];

    function renderProducts(filter=''){
      productsEl.innerHTML = '';
      const list = PRODUCTS.filter(p => (p.name + ' ' + p.desc).toLowerCase().includes(filter.toLowerCase()));
      list.forEach(p => {
        const c = document.createElement('div'); c.className='product-card';
        const imgStyle = p.img ? `background-image:url('${p.img}')` : '';
        c.innerHTML = `
          <div class="art" style="${imgStyle}"></div>
          <div class="prod-info">
            <strong>${p.name}</strong>
            <div class="muted">${p.desc}</div>
            <div class="price">$${p.price.toFixed(2)}</div>
          </div>
          <button class="add" data-id="${p.id}">Agregar</button>
        `;
        productsEl.appendChild(c);
      });
      productsEl.querySelectorAll('button').forEach(b => b.addEventListener('click', () => addToCart(Number(b.dataset.id))));
    }

    function addToCart(id){
      const p = PRODUCTS.find(x=>x.id===id); const e = cart.find(x=>x.id===id);
      if(e) e.qty++; else cart.push({...p,qty:1}); renderCart();
    }
    function renderCart(){
      cartItemsEl.innerHTML=''; let total=0; cart.forEach(i=>{ total+=i.price*i.qty; const d=document.createElement('div'); d.textContent=`${i.name} x${i.qty} - $${(i.price*i.qty).toFixed(2)}`; cartItemsEl.appendChild(d); }); cartTotalEl.textContent=`Total: $${total.toFixed(2)}`;
    }

    checkoutBtn.addEventListener('click', async ()=>{
      const { data } = await supabase.auth.getUser();
      const user = data?.user || null;
      if(!user){ alert('Inicia sesión para comprar'); window.location.href='login.html'; return; }
      if(cart.length===0){ alert('Carrito vacío'); return; }

      // Attempt to save order to Supabase 'orders' table
      const order = {
        user_id: user.id,
        user_email: user.email,
        items: cart.map(i=>({id:i.id, name:i.name, qty:i.qty, price:i.price})),
        total: cart.reduce((s,i)=>s + i.price*i.qty, 0),
        created_at: new Date().toISOString()
      };

      try {
        const { data:inserted, error } = await supabase.from('orders').insert(order).select();
        if (error) {
          console.error('Orders insert error', error);
          alert('No se pudo guardar la orden en la base de datos: ' + error.message + '. Se ha simulado el pedido.');
        } else {
          alert('Pedido guardado. Gracias, ' + user.email);
        }
      } catch (err) {
        console.error('Exception saving order', err);
        alert('Error al guardar la orden. Pedido simulado.');
      }

      cart.length=0; renderCart();
    });

    document.getElementById('logoutBtn').addEventListener('click', async ()=>{ await supabase.auth.signOut(); window.location.href='login.html'; });

    renderProducts();
    searchEl.addEventListener('input', (e)=> renderProducts(e.target.value));
  </script>
</body>
</html>
